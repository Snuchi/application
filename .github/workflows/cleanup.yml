# Ручная чистка: удаляет все релизы и теги, кроме текущей версии из package.json,
# и старые прогоны Actions (у каждого workflow остаётся только самый свежий).
# Запуск: Actions → Cleanup old releases → Run workflow.
name: Cleanup old releases

on:
  workflow_dispatch:

permissions:
  contents: write # удаление релизов и тегов
  actions: write # удаление старых прогонов Actions

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Delete old releases, tags and workflow runs
        run: bash .github/scripts/cleanup.sh
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_RUN: ${{ github.run_id }}
