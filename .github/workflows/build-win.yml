name: Build Windows

# Собирает Windows-установщик (NSIS) и portable-zip на windows-runner.
# Готовые файлы доступны во вкладке Actions → нужный запуск → Artifacts.

on:
  push:
    branches:
      - 'claude/**'
      - main
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows app (NSIS + portable zip)
        run: npm run build:win
        env:
          # На CI код не подписываем — отключаем попытки подписи.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RPBINDER-windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error
