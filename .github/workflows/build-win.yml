name: Build Windows

# Собирает Windows-установщик (NSIS) и portable-zip на windows-runner и
# публикует их в GitHub Release (страница Releases репозитория). Это же
# включает авто-обновление приложения через electron-updater.

on:
  push:
    branches:
      - 'claude/**'
      - main
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build & publish Windows release
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload build artifacts (резервная копия в Actions)
        uses: actions/upload-artifact@v4
        with:
          name: RPBINDER-windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error
