appId: com.rpbinder.app
productName: RPBINDER
directories:
  buildResources: build
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintrc,.prettierrc,tsconfig.json,tsconfig.*.json}'
  - '!{.git,.github}'
asarUnpack:
  - '**/*.node'
  - node_modules/uiohook-napi/**
  - node_modules/@nut-tree-fork/**
win:
  target:
    - nsis
    - zip
  artifactName: ${productName}-${version}-${target}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
