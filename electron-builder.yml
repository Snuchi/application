appId: com.avn.binder
productName: AVN Binder
directories:
  buildResources: build
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintrc,.prettierrc,tsconfig.json,tsconfig.*.json}'
  - '!{.git,.github}'
asarUnpack:
  - '**/*.node'
  - node_modules/avn-input/**
  - node_modules/uiohook-napi/**
  - node_modules/@nut-tree-fork/**
win:
  target:
    - nsis
    - zip
  artifactName: AVN-Binder-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
publish:
  provider: github
  owner: Snuchi
  repo: application
  releaseType: release
